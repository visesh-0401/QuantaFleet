services:
  # ----------------------------------------------------------------------------
  # Service 1: QuantaFleet (SIH26137 - Urban Traffic Route Optimization)
  # ----------------------------------------------------------------------------
  - type: web
    name: quantafleet
    env: docker
    region: singapore
    plan: free
    rootDir: Quantafleet
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health

  # ----------------------------------------------------------------------------
  # Service 2: QuantaGreen (SIH26138 - Green Fleet & Fuel Optimization)
  # ----------------------------------------------------------------------------
  - type: web
    name: quantagreen
    env: docker
    region: singapore
    plan: free
    rootDir: QuantaGreen
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
